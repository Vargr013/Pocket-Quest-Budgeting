name: Android build and Firebase rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install the checkout's compile SDK
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked test dependencies
        run: npm ci
      - name: Prepare synthetic debug client configuration
        run: npm run firebase:demo
      - name: Build, lint and test Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
      - name: Check Firestore and Storage rules
        run: npm run test:rules
